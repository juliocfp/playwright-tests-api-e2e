name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    # 1. Baixa o código do repositório
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Instala Python e configura Cache do Poetry automaticamente
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'poetry' # Cache nativo para dependências python

    # 3. Instala e configura o Poetry
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # 4. Instala dependências do projeto
    - name: Install Dependencies
      run: poetry install

    # 5. Cache Inteligente dos Browsers do Playwright
    # Isso evita baixar 300MB+ de binários toda vez que rodar
    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/poetry.lock') }}

    # 6. Instala Browsers (Apenas se o cache não existir)
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: poetry run playwright install --with-deps

    # 7. Executa os testes (Gera resultados brutos para o Allure)
    - name: Run Tests
      # 'continue-on-error: true' garante que o relatório seja gerado mesmo se testes falharem
      continue-on-error: true 
      run: poetry run task test-all  # Ou seu comando: pytest --alluredir=allure-results

    # 8. Gera o Relatório Allure com Histórico
    - name: Get Allure History
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    # 9. Publica o Relatório no GitHub Pages
    - name: Deploy Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history