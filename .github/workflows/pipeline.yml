name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  preparation:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Poetry
      run: pipx install poetry

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'poetry'

    - name: Install Dependencies
      run: poetry install

    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/poetry.lock') }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: poetry run playwright install --with-deps

  api-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: preparation

    steps:
    - name: Run Tests
      env:
        GOREST_BASE_URL: ${{ secrets.GOREST_BASE_URL }}
        GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
      run: poetry run task test-api

  e2e-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: api-test

    steps:
    - name: Run Tests
      env:
        GOREST_BASE_URL: ${{ secrets.GOREST_BASE_URL }}
        GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
      run: poetry run task test-e2e

  report:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: e2e-test


    steps:
    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results-debug
        path: allure-results
        retention-days: 1

    - name: Get Allure History
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: ${{ github.workspace }}/allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: Deploy Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
