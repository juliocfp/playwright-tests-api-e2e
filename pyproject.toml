[tool.poetry]
name = "playwright-tests"
version = "0.1.0"
description = "Testes automatizados de API e E2E com Playwright e Pytest"
authors = ["Julio Parra <julio1652@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^8.2.0"
pytest-playwright = "^0.7.2"
allure-pytest = "^2.13.5"
python-dotenv = "^1.0.1"
Faker = "^33.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Configurações padrão do Pytest
addopts = "--alluredir=allure-results --verbose -s"
